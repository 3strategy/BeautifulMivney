  <!-- Bootstrap CSS -->
  <style>
    html {
      font-size: 3em;
    }

    body {
      padding: 0.5em;
      font-family: 'Varela Round', sans-serif;
      /* font-size: 1.5em; */
      text-align: center;
      direction: rtl;
      /* Keep the direction RTL as you have it */
    }

    h4 {
      /* font-size: 0.7em; */
      direction: rtl;
    }

    .stack-panels {
      display: flex;
      gap: 0.45em;
      align-items: stretch;
    }

    .stack-panels .container {
      flex: 1;
      min-width: 0;
      padding-inline: 0.2em;
    }

    .stack-container {
      display: flex;
      flex-direction: column-reverse; /* show top at the top visually */
      justify-content: flex-start;
      align-items: center;
      margin-bottom: 10px;
      direction: ltr;
      margin-left: auto;
      margin-right: auto;
    }

    .container {
      border: 0.05em solid salmon;
      border-radius: 0.4em;
      margin-bottom: 0.4em;
      min-height: 7em;
    }

    .stack-item {
      font-size: 1.8em;
      width: 2.2em;
      max-width: 95%;
      height: 1.6em;
      min-height: 1.6em;
      border: 0.05em solid black;
      border-radius: 0.2em;
      margin: 0.1em;
      /* Rounded corners */
      display: flex;
      justify-content: center;
      align-items: center;
      /* margin-right: 5px; */
    }

    .btn {
      line-height: 1.25;
    }
    /* Center the buttons within their container */
    .button-container {
      text-align: center;
      /* This centers the inline elements (buttons) */
      margin: auto;
      padding: 0.3em;
      padding-top: 0.0em;
      /* This centers the container itself if it has a set width */
      direction: rtl;
      /* Maintain RTL direction for the buttons */
    }

    .hover-effect {
      background-color: rgb(40, 167, 69);
      /* Example hover background color */
      color: #FFFFFF;
      /* Example text color change */
      /* Add other hover styles as needed */
    }

    @media (max-width: 1600px) {
      html {
        font-size: 2em;
      }
    }
    @media (max-width: 900px) {
      html {
        font-size: 1.5em;
      }
    }
  </style>
  <link rel="stylesheet" href="../../assets/css/collection-animation.css">
  <script src="../../assets/js/collection-animation.js"></script>

<body>

  <div class="button-container">
    <button id="btn1" class="btn btn-outline-secondary" onclick="resetStack()">איתחול</button>
    <button id="btn2" class="btn btn-outline-success" onclick="popStack()">הוצאה מהמחסנית</button>
    <button id="btn3" class="btn btn-outline-success" onclick="moveAllToTempStack()">העברה למחסנית זמנית</button>
    <button id="btn4" class="btn btn-outline-success" onclick="pushNew()">דחיפה</button>
    <button id="btn5" class="btn btn-outline-success" onclick="startDuplicationCycleStack()">שכפול</button>
    <button id="btn6" class="btn btn-outline-success" onclick="pushNew(1)">דחוף1</button>
    <button id="btn7" class="btn btn-outline-success" onclick="resetStackSimilar()">דומים</button>
  </div>



  <div class="stack-panels">
    <div class="container">
      <h4 id="s1">מחסנית מקורית</h4>
      <div id="stack" class="stack-container"></div>
    </div>
    <div id="workStackPanel" class="container" hidden>
      <h4>מחסנית עזר</h4>
      <div id="workStack" class="stack-container"></div>
    </div>
    <div class="container">
      <h4 id="temp_dup">מחסנית זמנית</h4>
      <div id="tempStack" class="stack-container"></div>
    </div>
  </div>

  <div class="button-container" data-standalone-only>
    <a id="link8" class="btn btn-outline-light"
      href="file:///C:/Users/3stra/OneDrive/Documents/OrtCSharp/MergedBagrutAlon.pdf">שאלה</a>
    <a id="link9" class="btn btn-outline-light"
      href="https://docs.google.com/presentation/d/1F4YjUxq7OyWtPCByhn-4XlFWsRrlT0i_RqpAGQzqmCQ/present?usp=sharing">מצגת</a>
  </div>
  <script>
    let stack = [1, 2, 3, 4]; // Initial stack (top is at the end)
    let tempStack = []; // Temporary stack
    let workStack = [];
    const stackContainer = document.getElementById('stack');
    const tempStackContainer = document.getElementById('tempStack');
    const workStackContainer = document.getElementById('workStack');
    const workStackPanel = document.getElementById('workStackPanel');
    const animation = createCollectionAnimation();

    function displayItems(items, container) {
      container.innerHTML = '';
      items.forEach(item => {
        const element = document.createElement('div');
        element.className = 'stack-item';
        element.textContent = item;
        element.style.backgroundColor = getColorForItemValue(item);
        container.appendChild(element);
      });
    }

    function displayStack() {
      displayItems(stack, stackContainer);
    }

    function displayTempStack() {
      displayItems(tempStack, tempStackContainer);
    }

    function finishAnimation() {
      animation.cancel();
      workStack = [];
      displayItems(workStack, workStackContainer);
      workStackPanel.hidden = true;
    }

    function resetStackSimilar() {
      finishAnimation();
      stack = [4, 6, 5, 7];
      tempStack = [5, 7, 4, 6];
      displayStack();
      displayTempStack();
      document.getElementById("s1").innerText = "מחסנית S1";
      document.getElementById("temp_dup").innerText = "מחסנית S2";
    }

    function resetStack() {
      finishAnimation();
      stack = [1, 2, 3, 4];
      tempStack = [];
      displayStack();
      displayTempStack();
      document.getElementById("s1").innerText = "מחסנית מקורית";
      document.getElementById("temp_dup").innerText = "מחסנית זמנית";
    }

    function popStack() {
      if (stack.length > 0) {
        stack.pop();
        displayStack();
      }
    }

    function moveAllToTempStack() {
      if (stack.length === 0) return;
      document.getElementById("temp_dup").innerText = "מחסנית זמנית";

      function moveItemToTemp() {
        tempStack.push(stack.pop());
        displayStack();
        displayTempStack();

        if (stack.length > 0) {
          animation.after(700, moveItemToTemp);
        } else {
          animation.cancel();
        }
      }

      moveItemToTemp();
    }

    function pushNew(value = stack.length > 0 ? Math.max(...stack) + 1 : 1) {
      stack.push(value);
      displayStack();
    }

    function startDuplicationCycleStack() {
      tempStack = [];
      displayTempStack();
      document.getElementById("s1").innerText = "מחסנית מקורית";
      document.getElementById("temp_dup").innerText = "מחסנית משוכפלת";

      if (stack.length === 0) return;
      workStackPanel.hidden = false;

      // Reverse the original onto a helper stack so its bottom item comes out first.
      function moveToWorkStack() {
        workStack.push(stack.pop());
        displayStack();
        displayItems(workStack, workStackContainer);
        animation.after(500, stack.length > 0 ? moveToWorkStack : duplicateItems);
      }

      function duplicateItems() {
        const item = workStack.pop();
        stack.push(item);
        tempStack.push(item);
        displayStack();
        displayTempStack();
        displayItems(workStack, workStackContainer);
        if (workStack.length > 0) {
          animation.after(700, duplicateItems);
        } else {
          finishAnimation();
        }
      }

      moveToWorkStack();
    }


    function getColorForItemValue(value) {
      const colors = {
        1: '#FFCCCC', // Light red
        2: '#CCFFCC', // Light green
        3: '#CCCCFF', // Light blue
        4: '#FFFFCC', // Light yellow
        5: '#FFCCCC', // Light red
        6: '#CCFFCC', // Light green
        7: '#CCCCFF', // Light blue
        8: '#FFFFCC', // Light yellow
        // Add more mappings as needed
      };

      return colors[value] || '#FFFFFF'; // Default to white if no specific color is defined
    }

    enablePresentationControls();

    // Initial display
    displayStack();
    displayTempStack();
  </script>
</body>
