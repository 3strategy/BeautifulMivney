<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="500" height="350" role="img" aria-labelledby="title description">
  <title id="title">Two circles and the distance between their centers</title>
  <desc id="description">A blue circle with radius r1, an orange circle with radius r2, and a line labeled d joining their center points.</desc>

  <rect width="100%" height="100%" fill="white" />

  <line x1="140" y1="175" x2="335" y2="175" stroke="#333333" stroke-width="2" />
  <circle cx="140" cy="175" r="95" fill="none" stroke="#1a3f7a" stroke-width="8" />
  <circle cx="335" cy="175" r="55" fill="none" stroke="#a64b17" stroke-width="8" />

  <circle cx="140" cy="175" r="5" fill="#333333" />
  <circle cx="335" cy="175" r="5" fill="#333333" />

  <text x="255" y="160" font-family="serif" font-size="22" fill="#333333" text-anchor="middle" font-style="italic" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">d</text>

  <text x="140" y="45" font-family="sans-serif" font-size="28" fill="#1a3f7a" text-anchor="middle" font-weight="bold">r1</text>
  <text x="380" y="75" font-family="sans-serif" font-size="28" fill="#a64b17" text-anchor="middle" font-weight="bold">r2</text>
</svg>
