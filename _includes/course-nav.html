<div class="dropdown navbar-courses">
  <button class="course-toggle dropdown-toggle" type="button" id="course-selector" data-toggle="dropdown" data-display="static" aria-expanded="false" aria-controls="course-menu">
    <span id="current-course" data-active-course="{{ include.current }}">{{ site.navbar-menu-sets[include.current].label }}</span>
  </button>
  <div class="dropdown-menu dropdown-menu-right" id="course-menu" aria-labelledby="course-selector">
    {% for menu_set in site.navbar-menu-sets %}
      <a class="dropdown-item" href="{{ menu_set[1].url | relative_url }}" data-course-menu="{{ menu_set[0] }}"{% if include.current == menu_set[0] %} aria-current="true"{% endif %}>{{ menu_set[1].label }}</a>
    {% endfor %}
  </div>
</div>
