<link rel="stylesheet" href="{{ '/assets/css/language-preference.css' | relative_url }}">
<script id="lesson-language-data" type="application/json">{
  "language": {{ page.lang | default: page.language | default: site.lang | default: 'he' | jsonify }},
  "versions": { {% for version in page.translation_versions %}{{ version[0] | jsonify }}: {{ version[1] | relative_url | jsonify }}{% unless forloop.last %},{% endunless %}{% endfor %} }
}</script>
<script src="{{ '/assets/js/language-preference.js' | relative_url }}"></script>
{% for version in page.translation_versions %}
<link rel="alternate" hreflang="{{ version[0] | escape }}" href="{{ version[1] | absolute_url }}?lang={{ version[0] | escape }}">
{% endfor %}
